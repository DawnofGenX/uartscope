<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="96" fill="#0f1011"/>
  <rect x="16" y="16" width="480" height="480" rx="80" stroke="#23252a" stroke-width="2"/>
