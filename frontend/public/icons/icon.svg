  <line x1="80" y1="352" x2="432" y2="352" stroke="#23252a" stroke-width="1"/>
  <line x1="80" y1="208" x2="432" y2="208" stroke="#191a1b" stroke-width="1"/>
  <line x1="80" y1="304" x2="432" y2="304" stroke="#191a1b" stroke-width="1"/>
  <line x1="160" y1="120" x2="160" y2="400" stroke="#191a1b" stroke-width="1"/>
