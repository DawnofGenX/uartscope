name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          pip install ruff
          cd backend && ruff check app/ --max-line-length=120

      - name: Test with pytest
        run: |
          cd backend && pytest tests/ -v --tb=short
        env:
          UARTSCOPE_DATABASE_URL: sqlite+aiosqlite:///./test.db

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -f Dockerfile.backend -t uartscope-backend .

      - name: Build desktop Docker image
        run: docker build -f Dockerfile.desktop -t uartscope-desktop .

  build-windows:
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend; pip install -r requirements.txt
          pip install pyinstaller nicegui

      - name: Build Windows executable
        run: |
          pyinstaller --onefile --name uartscope --clean launch.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: uartscope-windows-x64
          path: dist/uartscope.exe

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/uartscope.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
