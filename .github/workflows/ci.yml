name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          pip install ruff
          cd backend && ruff check app/ --max-line-length=120

      - name: Test with pytest
        run: |
          cd backend && pytest tests/ -v --tb=short
        env:
          UARTSCOPE_DATABASE_URL: sqlite+aiosqlite:///./test.db

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -f Dockerfile.backend -t uartscope-backend .

      - name: Build desktop Docker image
        run: docker build -f Dockerfile.desktop -t uartscope-desktop .
