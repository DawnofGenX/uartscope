name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          # --max-line-length is not a ruff flag; the flag is --line-length.
          # The old invocation exited 2 on the argument error, so this job had
          # never actually linted anything.
          pip install ruff
          cd backend && ruff check app/ --line-length=120 --select E9,F63,F7,F82

      - name: Test with pytest
        run: |
          cd backend && pytest tests/ -v --tb=short
        env:
          UARTSCOPE_DATABASE_URL: sqlite+aiosqlite:///./test.db

      # The static checks exist because v1 shipped six screens that raised
      # UnboundLocalError on every render, and a dict key the UI read that no
      # producer ever wrote. Both are invisible to pytest -- the screen simply
      # does not appear -- so they need their own gate.
      - name: Static checks
        run: |
          pip install pyyaml
          python check_handler_order.py
          python check_dict_keys.py
          # Exits 1 if a recorded contrast ratio has drifted from the computed
          # one, or if any documented pair fails its WCAG verdict.
          python -m uartscope_theme --audit

      - name: Build every screen over HTTP
        run: |
          # Boots the real app and requests every page, so a screen that
          # raises during render fails the build rather than the user.
          pip install -r backend/requirements.txt
          python smoke_pages.py --boot --wait 60

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -f Dockerfile.backend -t uartscope-backend .

      - name: Build desktop Docker image
        run: docker build -f Dockerfile.desktop -t uartscope-desktop .

  build-windows:
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend; pip install -r requirements.txt
          # nicegui used to be pinned here because the manifests omitted it; it
          # is a declared dependency now. pyinstaller is build-only and stays.
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --onefile --name uartscope --clean launch.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: uartscope-windows-x64
          path: dist/uartscope.exe

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/uartscope.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
