name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          # --max-line-length is not a ruff flag; the flag is --line-length.
          # The old invocation exited 2 on the argument error, so this job had
          # never actually linted anything.
          pip install ruff
          cd backend && ruff check app/ --line-length=120 --select E9,F63,F7,F82

      - name: Test with pytest
        run: |
          cd backend && pytest tests/ -v --tb=short
        env:
          UARTSCOPE_DATABASE_URL: sqlite+aiosqlite:///./test.db

      # The hardware tests run against a pty, which is a real character device
      # the kernel drives exactly as it drives /dev/ttyUSB0 -- no physical
      # adapter, no root, no /dev/ttyUSB* present. That is why they execute at
      # all on a hosted runner.
      #
      # This step asserts they RAN. Without it, adding a skip guard for "no
      # serial hardware in CI" would silently turn the only tests that exercise
      # the reader into no-ops: the suite stays green, the coverage disappears,
      # and the Terminal-callback and split-frame bugs that shipped through a
      # green 161-test suite come straight back. A test that stops running must
      # fail the build, not quietly pass.
      - name: Hardware-path tests actually ran
        run: |
          cd backend
          pytest tests/test_binary_framing.py \
                 tests/test_byte_preservation.py \
                 tests/test_parity_stopbits.py \
                 tests/test_terminal_callback_contract.py \
                 -v --tb=short -p no:cacheprovider 2>&1 | tee /tmp/hw.log
          # A collection error, a skip, or a missing file must all fail here.
          # pytest exits 5 when it collected nothing at all.
          #
          # Match the SUMMARY line only. Two earlier versions of this check were
          # broken in ways that would have shipped silently:
          #   - anchoring with ^ never matches, because pytest wraps the summary
          #     in '=' fences, so the gate failed every GOOD build;
          #   - matching a bare 'error' anywhere matched test names like
          #     test_binary_frame_has_decode_error_flag and every
          #     PydanticDeprecatedSince20 warning line, so the gate failed
          #     every build too.
          # Read the summary, then require every count in it to be zero-skipped.
          summary="$(grep -E '=+ .*(passed|failed|error).* =+' /tmp/hw.log | tail -1)"
          echo "summary: ${summary:-<none found>}"
          if [ -z "$summary" ]; then
            echo "::error::no pytest summary line -- the hardware tests did not run"
            exit 1
          fi
          if ! echo "$summary" | grep -qE '[0-9]+ passed'; then
            echo "::error::the serial hardware tests did not pass -- see above"
            exit 1
          fi
          if echo "$summary" | grep -qE '[0-9]+ (skipped|failed|error)'; then
            echo "::error::serial hardware tests were skipped, failed or errored"
            exit 1
          fi

      # The static checks exist because v1 shipped six screens that raised
      # UnboundLocalError on every render, and a dict key the UI read that no
      # producer ever wrote. Both are invisible to pytest -- the screen simply
      # does not appear -- so they need their own gate.
      - name: Static checks
        run: |
          pip install pyyaml
          python check_handler_order.py
          python check_dict_keys.py
          # Exits 1 if a recorded contrast ratio has drifted from the computed
          # one, or if any documented pair fails its WCAG verdict.
          python -m uartscope_theme --audit

      - name: Build every screen over HTTP
        run: |
          # Boots the real app and requests every page, so a screen that
          # raises during render fails the build rather than the user.
          pip install -r backend/requirements.txt
          python smoke_pages.py --boot --wait 60

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -f Dockerfile.backend -t uartscope-backend .

      - name: Build desktop Docker image
        run: docker build -f Dockerfile.desktop -t uartscope-desktop .

  build-windows:
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'release'

    # The default GITHUB_TOKEN is read-only. "Attach to release" needs to write
    # the .exe to the release, and without this it fails with
    # "Resource not accessible by integration" AFTER the executable has
    # already been built -- so the build succeeds, the upload does not, and
    # the release ships with no binary and no obvious reason why.
    #
    # Scoped to this job: the test and docker jobs need nothing but read.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend; pip install -r requirements.txt
          # nicegui used to be pinned here because the manifests omitted it; it
          # is a declared dependency now. pyinstaller is build-only and stays.
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --onefile --name uartscope --clean launch.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: uartscope-windows-x64
          path: dist/uartscope.exe

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/uartscope.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
